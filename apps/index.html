<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Apps</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="top">
    <a class="name" href="../">Home</a>
    <nav>
      <a href="../writing/">Writing</a>
      <a href="./" aria-current="page">Apps</a>
    </nav>
  </header>

  <main class="page">
    <h1>Apps</h1>
    <div id="apps"></div>
  </main>

  <script src="../assets/content.js"></script>
  <script>
    var main = document.getElementById("apps");

    if (!SITE.apps.length) main.innerHTML = '<p class="empty">Nothing yet.</p>';

    // Group by section, then by module, keeping the order of content.js.
    var lists = {};
    function listFor(section, module) {
      var key = section + "/" + (module || "");
      if (lists[key]) return lists[key];
      if (!lists[section]) {
        var h = document.createElement("h2");
        h.className = "group";
        h.textContent = section;
        main.append(h);
        lists[section] = true;
      }
      if (module) {
        var m = document.createElement("h3");
        m.className = "module";
        m.textContent = module;
        main.append(m);
      }
      var ul = document.createElement("ul");
      ul.className = "list";
      main.append(ul);
      return (lists[key] = ul);
    }

    SITE.apps.forEach(function (app) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "view.html?app=" + encodeURIComponent(app.slug);
      var t = document.createElement("span");
      t.className = "title";
      t.textContent = app.title;
      var n = document.createElement("span");
      n.className = "meta";
      n.textContent = app.note || "";
      a.append(t, n);
      li.append(a);
      listFor(app.section || "Apps", app.module).append(li);
    });
  </script>
</body>
</html>
